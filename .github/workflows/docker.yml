name: Docker verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate disposable secrets
        run: node docker/setup.cjs
      - name: Build and start complete stack
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Verify web, proxy, replica set, and Socket.IO
        run: |
          curl --fail http://localhost:8080/ | grep -q '<html'
          curl --fail http://localhost:8080/api/ready | grep -q '"success":true'
          curl --fail 'http://localhost:8080/socket.io/?EIO=4&transport=polling' | grep -q '"sid"'
          curl --fail http://localhost:8080/student/history | grep -q '<html'
      - name: Run existing security integration tests in Docker
        run: docker compose --profile test run --build --rm test
      - name: Verify explicit demo setup and login
        run: |
          docker compose --profile demo run --build --rm -e ALLOW_DEMO_RESET=true seed
          for email in admin@example.com niketha@lecturer.example.com nikky@student.example.com; do
            curl --fail -H 'Content-Type: application/json' --data "{\"identifier\":\"$email\",\"password\":\"password123\"}" http://localhost:8080/api/auth/login | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{if(!JSON.parse(s).data?.accessToken)process.exit(1)})"
          done
      - name: Check restart and persistent database
        run: |
          docker compose restart mongo api web
          docker compose up -d --wait --wait-timeout 240
          curl --fail http://localhost:8080/api/ready | grep -q '"success":true'
          curl --fail -H 'Content-Type: application/json' --data '{"identifier":"admin@example.com","password":"password123"}' http://localhost:8080/api/auth/login | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{if(!JSON.parse(s).data?.accessToken)process.exit(1)})"
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Cleanup disposable stack
        if: always()
        run: docker compose --profile test down -v
